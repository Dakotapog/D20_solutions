<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Servicio | D20 Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">D20</div>
                <span class="logo-text">D20 Solutions</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html" class="active">Servicios</a></li>
                <li><a href="#instituciones">Instituciones</a></li>
                <li><a href="#soporte">Soporte</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
            <a href="login.html" class="cta-button">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- Breadcrumb -->
    <section class="breadcrumb">
        <div class="container">
            <nav class="breadcrumb-nav">
                <a href="index.html">Inicio</a>
                <span>→</span>
                <a href="services.html">Servicios</a>
                <span>→</span>
                <span>Cargando...</span>
            </nav>
        </div>
    </section>

    <!-- Service Detail Hero -->
    <section class="service-detail-hero">
        <div class="container">
            <div class="service-detail-grid">
                <div class="service-image-section">
                    <div class="service-main-image">
                        <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Servicio D20">
                    </div>
                    <div class="service-gallery">
                        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Dashboard">
                        <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Analytics">
                        <img src="https://images.unsplash.com/photo-1586953208448-b95a79798f07?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Reports">
                    </div>
                </div>
                
                <div class="service-info-section">
                    <div class="service-badges">
                        <!-- Se llenará dinámicamente -->
                    </div>
                    
                    <h1>Cargando...</h1>
                    <p class="service-subtitle">Cargando descripción...</p>
                    
                    <div class="price-section">
                        <div class="price-current">
                            <span class="price-value">$0</span>
                            <span class="price-period">/mes</span>
                        </div>
                    </div>
                    
                    <div class="availability-section">
                        <div class="availability-item">
                            <span class="label">Cantidad Disponible:</span>
                            <span class="value success" id="service-quantity">Cargando...</span>
                        </div>
                        <div class="availability-item">
                            <span class="label">Implementación:</span>
                            <span class="value">2-3 semanas</span>
                        </div>
                        <div class="availability-item">
                            <span class="label">Soporte:</span>
                            <span class="value">24/7</span>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn-primary-large">Solicitar Demo</button>
                        <button class="btn-secondary-large">Más Información</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

   <!-- Service Details Tabs -->
   <section class="service-details">
       <div class="container">
           <div class="tabs-container">
               <div class="tabs-nav">
                   <button class="tab-btn active" data-tab="features">Características</button>
                   <button class="tab-btn" data-tab="description">Descripción</button>
                   <button class="tab-btn" data-tab="pricing">Precios</button>
                   <button class="tab-btn" data-tab="support">Soporte</button>
               </div>
               
               <div class="tabs-content">
                   <!-- Features Tab -->
                   <div class="tab-content active" id="features">
                       <!-- Contenido dinámico o estático -->
                   </div>
                   
                   <!-- Description Tab -->
                   <div class="tab-content" id="description">
                        <!-- Contenido dinámico o estático -->
                   </div>
                   
                   <!-- Pricing Tab -->
                   <div class="tab-content" id="pricing">
                        <!-- Contenido dinámico o estático -->
                   </div>
                   
                   <!-- Support Tab -->
                   <div class="tab-content" id="support">
                        <!-- Contenido dinámico o estático -->
                   </div>
               </div>
           </div>
       </div>
   </section>

   <!-- Related Services -->
   <section class="related-services">
       <!-- Contenido dinámico o estático -->
   </section>
    <script src="js/main.js"></script>
</body>
</html>
